<div class="field" [class.field--invalid]="errorMessage()" [class.field--disabled]="disabled()">
  <label class="field__label" [class.sr-only]="hideLabel()" [for]="id">{{ label() }}</label>

  <div class="field__control">
    <select
      class="field__select"
      [class.field__select--sm]="size() === 'sm'"
      [id]="id"
      [disabled]="disabled()"
      [attr.aria-invalid]="errorMessage() ? true : null"
      [attr.aria-describedby]="describedBy()"
      (change)="handleChange($event)"
      (blur)="markTouched()"
    >
      @for (option of options(); track option.value) {
        <option [value]="option.value" [selected]="option.value === value()">
          {{ option.label }}
        </option>
      }
    </select>
    <app-icon class="field__chevron" name="chevron-down" [size]="16" />
  </div>

  @if (errorMessage(); as message) {
    <p class="field__message field__message--error" [id]="id + '-error'" role="alert">
      {{ message }}
    </p>
  } @else if (hint(); as hintText) {
    <p class="field__message" [id]="id + '-hint'">{{ hintText }}</p>
  }
</div>
